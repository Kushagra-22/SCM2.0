apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm2-app
  namespace: default
  labels:
    app: scm2
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scm2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: scm2
        component: backend
    spec:
      containers:
      - name: scm2
        image: scm2.0:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://db:3306/scm2.0"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        # ===== Readiness Probe =====
        # Checks if the app can serve traffic (DB connected, dependencies ready)
        # If this fails, K8s removes the pod from Service endpoints
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1
        # ===== Liveness Probe =====
        # Checks if the app process is alive (not deadlocked/frozen)
        # If this fails, K8s restarts the container
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        # ===== Resource Limits =====
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"