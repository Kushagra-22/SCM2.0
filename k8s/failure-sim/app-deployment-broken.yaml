# =============================================
# FAILURE SIMULATION: Wrong Database URL
# =============================================
# This deployment intentionally uses a WRONG database hostname
# to simulate a database connectivity failure.
#
# What happens:
#   1. Pod starts, Spring Boot tries to connect to "wrong-db-host"
#   2. Connection fails → UnknownHostException
#   3. Readiness probe fails → Pod marked as "NotReady"
#   4. K8s removes pod from Service endpoints (no traffic routed)
#   5. After failureThreshold (3), liveness probe also fails
#   6. Container enters CrashLoopBackOff
#
# How to debug:
#   kubectl get pods                      → see NotReady/CrashLoopBackOff
#   kubectl describe pod <pod-name>       → see probe failure events
#   kubectl logs <pod-name>               → see Spring Boot error logs
#   kubectl get events --sort-by=.lastTimestamp  → see cluster events
#
# How to fix:
#   kubectl apply -f k8s/app/app-deployment.yaml  → apply correct manifest
# =============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm2-app
  namespace: default
  labels:
    app: scm2
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scm2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: scm2
        component: backend
    spec:
      containers:
      - name: scm2
        image: scm2.0:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        # ⚠️ INTENTIONAL BUG: wrong-db-host does not exist
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://wrong-db-host:3306/scm2.0"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
